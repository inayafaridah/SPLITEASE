name: splitage
description: Bill splitting app with SQLite
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.2
  path: ^1.9.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  intl: ^0.19.0
  fl_chart: ^0.68.0
  uuid: ^4.4.0
  flutter_local_notifications: ^17.2.2
  share_plus: ^9.0.0
  lottie: ^3.1.0
  cupertino_icons: ^1.0.6
  pdf: ^3.11.1
  printing: ^5.13.1
  flutter_slidable: ^3.1.1
  image_picker: ^1.2.2
  image_cropper: ^12.2.1
  google_fonts: ^8.1.0
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
